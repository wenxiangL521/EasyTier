name: wmcl

# Builds EasyTier for every platform/arch the WMCL launcher supports.
#   Android arm64 / x86_64 : easytier-cli + libeasytier_ffi.so
#   Desktop Linux / Windows (x64 + arm64): easytier-core + easytier-cli
#   macOS x64 / arm64 cross-compiled on Linux (zig + macOS SDK, no macOS runner)
#
# Releases: wmcl-android-v2.6.4 and wmcl-desktop-v2.6.4

on:
  workflow_dispatch:
  push:
    branches: [wmcl]
    paths:
      - '.github/workflows/wmcl.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'easytier/**'
      - 'easytier-rpc-build/**'
      - 'easytier-contrib/**'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
            clang: aarch64-linux-android26-clang
          - arch: x86_64
            target: x86_64-linux-android
            clang: x86_64-linux-android26-clang
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config
          protoc --version

      - name: Add Android target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-android-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Cross compile
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_LINKER="$TOOLCHAIN/${{ matrix.clang }}"
          export CARGO_TARGET_${{ matrix.target }}_LINKER="$TARGET_LINKER"
          export "CC_${{ matrix.target }}=$TARGET_LINKER"
          export "AR_${{ matrix.target }}=$TOOLCHAIN/llvm-ar"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=${{ matrix.target }}"

          cargo build --release --target ${{ matrix.target }} --bin easytier-cli
          cargo build --release --target ${{ matrix.target }} -p easytier-ffi

      - name: Strip and package
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          STRIP="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cd target/${{ matrix.target }}/release
          "$STRIP" --strip-all easytier-cli
          "$STRIP" --strip-all libeasytier_ffi.so
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cp easytier-cli "$GITHUB_WORKSPACE/out/easytier-cli"
            cp libeasytier_ffi.so "$GITHUB_WORKSPACE/out/libeasytier_ffi.so"
          else
            cp easytier-cli "$GITHUB_WORKSPACE/out/easytier-cli-x86_64"
            cp libeasytier_ffi.so "$GITHUB_WORKSPACE/out/libeasytier_ffi-x86_64.so"
          fi
          md5sum "$GITHUB_WORKSPACE/out"/*

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-android-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config
          protoc --version

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin easytier-core --bin easytier-cli

      - name: Package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          strip easytier-core easytier-cli || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp easytier-core "$GITHUB_WORKSPACE/out/easytier-core-linux-${{ matrix.arch }}"
          cp easytier-cli "$GITHUB_WORKSPACE/out/easytier-cli-linux-${{ matrix.arch }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (cross on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libclang-dev pkg-config llvm curl xz-utils
          protoc --version

      - name: Add macOS target
        run: rustup target add ${{ matrix.target }}

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: true

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Download macOS SDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/MacOSX15.5.sdk.tar.xz \
            https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz
          mkdir -p "$HOME/macos-sdk"
          tar -xJf /tmp/MacOSX15.5.sdk.tar.xz -C "$HOME/macos-sdk"
          echo "SDKROOT=$HOME/macos-sdk/MacOSX15.5.sdk" >> "$GITHUB_ENV"
          ls "$HOME/macos-sdk/MacOSX15.5.sdk" | head

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-macos-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Cross compile
        run: |
          set -euo pipefail
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$SDKROOT --target=${{ matrix.target }}"
          cargo zigbuild --release --target ${{ matrix.target }} --bin easytier-core --bin easytier-cli

      - name: Package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          llvm-strip easytier-core easytier-cli || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp easytier-core "$GITHUB_WORKSPACE/out/easytier-core-macos-${{ matrix.arch }}"
          cp easytier-cli "$GITHUB_WORKSPACE/out/easytier-cli-macos-${{ matrix.arch }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf
        run: |
          choco install protoc -y
          protoc --version

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-windows-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin easytier-core --bin easytier-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/easytier-core.exe" "out/easytier-core-windows-${{ matrix.arch }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/easytier-cli.exe" "out/easytier-cli-windows-${{ matrix.arch }}.exe"
          Get-ChildItem "out"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish-android:
    name: Publish Android release
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: wmcl-android-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wmcl-android-v2.6.4
          name: WMCL Android EasyTier 2.6.4
          body: |
            EasyTier Android artifacts for the WMCL launcher.
            - easytier-cli / libeasytier_ffi.so: arm64 (used by the WMCL APK)
            - easytier-cli-x86_64 / libeasytier_ffi-x86_64.so: x86_64
            TCP STUN list extended with China-reachable nodes.
          files: out/*
          overwrite_files: true

  publish-desktop:
    name: Publish desktop release
    needs: [linux, windows, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: wmcl-linux-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: wmcl-windows-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: wmcl-macos-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wmcl-desktop-v2.6.4
          name: WMCL Desktop EasyTier 2.6.4
          body: |
            EasyTier desktop binaries for the WMCL launcher.
            - Linux: x86_64, arm64
            - Windows: x86_64, arm64
            - macOS: x86_64, arm64 (cross-compiled on Linux)
            TCP STUN list expanded with China-reachable nodes.
          files: out/*
          overwrite_files: true
