name: wmcl

# Builds EasyTier for every platform/arch the WMCL launcher supports.
#   Android arm64 / x86_64 : easytier-cli + libeasytier_ffi.so
#   Desktop Linux / Windows (x64 + arm64): easytier-core + easytier-cli
#   macOS x64 / arm64 cross-compiled on Linux (zig + macOS SDK, no macOS runner)
#
# Releases: wmcl-android-v2.6.4 and wmcl-desktop-v2.6.4

on:
  workflow_dispatch:
  push:
    branches: [wmcl]
    paths:
      - '.github/workflows/wmcl.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'easytier/**'
      - 'easytier-rpc-build/**'
      - 'easytier-contrib/**'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
            clang: aarch64-linux-android26-clang
            cc_env: aarch64_linux_android
            link_env: AARCH64_LINUX_ANDROID
          - arch: x86_64
            target: x86_64-linux-android
            clang: x86_64-linux-android26-clang
            cc_env: x86_64_linux_android
            link_env: X86_64_LINUX_ANDROID
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config
          protoc --version

      - name: Add Android target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-android-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Cross compile
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_LINKER="$TOOLCHAIN/${{ matrix.clang }}"
          export "CARGO_TARGET_${{ matrix.link_env }}_LINKER=$TARGET_LINKER"
          export "CC_${{ matrix.cc_env }}=$TARGET_LINKER"
          export "AR_${{ matrix.cc_env }}=$TOOLCHAIN/llvm-ar"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=${{ matrix.target }}"

          cargo build --release --target ${{ matrix.target }} --bin easytier-cli
          cargo build --release --target ${{ matrix.target }} -p easytier-ffi

      - name: Strip and package
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          STRIP="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cd target/${{ matrix.target }}/release
          "$STRIP" --strip-all easytier-cli
          "$STRIP" --strip-all libeasytier_ffi.so
          PKG="easytier-android-${{ matrix.arch }}"
          mkdir -p "$GITHUB_WORKSPACE/out/$PKG"
          cp easytier-cli "$GITHUB_WORKSPACE/out/$PKG/easytier-cli"
          cp libeasytier_ffi.so "$GITHUB_WORKSPACE/out/$PKG/libeasytier_ffi.so"
          cd "$GITHUB_WORKSPACE/out"
          zip -r "$PKG-v2.6.4.zip" "$PKG"
          rm -rf "$PKG"
          ls -la *.zip

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-android-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            arch_token: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            arch_token: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config zip
          protoc --version

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin easytier-core --bin easytier-cli

      - name: Package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          strip easytier-core easytier-cli || true
          PKG="easytier-linux-${{ matrix.arch_token }}"
          mkdir -p "$GITHUB_WORKSPACE/out/$PKG"
          cp easytier-core "$GITHUB_WORKSPACE/out/$PKG/easytier-core"
          cp easytier-cli "$GITHUB_WORKSPACE/out/$PKG/easytier-cli"
          cd "$GITHUB_WORKSPACE/out"
          zip -r "$PKG-v2.6.4.zip" "$PKG"
          rm -rf "$PKG"
          ls -la *.zip

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (cross on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            arch_token: x86_64
            target: x86_64-apple-darwin
          - arch: arm64
            arch_token: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang libclang-dev pkg-config llvm curl xz-utils zip
          protoc --version

      - name: Add macOS target
        run: rustup target add ${{ matrix.target }}

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: true

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Download macOS SDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/MacOSX15.5.sdk.tar.xz \
            https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz
          mkdir -p "$HOME/macos-sdk"
          tar -xJf /tmp/MacOSX15.5.sdk.tar.xz -C "$HOME/macos-sdk"
          echo "SDKROOT=$HOME/macos-sdk/MacOSX15.5.sdk" >> "$GITHUB_ENV"
          ls "$HOME/macos-sdk/MacOSX15.5.sdk" | head

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-macos-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Cross compile
        run: |
          set -euo pipefail
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$SDKROOT --target=${{ matrix.target }}"
          cargo zigbuild --release --target ${{ matrix.target }} --bin easytier-core --bin easytier-cli

      - name: Package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          llvm-strip easytier-core easytier-cli || true
          PKG="easytier-macos-${{ matrix.arch_token }}"
          mkdir -p "$GITHUB_WORKSPACE/out/$PKG"
          cp easytier-core "$GITHUB_WORKSPACE/out/$PKG/easytier-core"
          cp easytier-cli "$GITHUB_WORKSPACE/out/$PKG/easytier-cli"
          cd "$GITHUB_WORKSPACE/out"
          zip -r "$PKG-v2.6.4.zip" "$PKG"
          rm -rf "$PKG"
          ls -la *.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            arch_token: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            arch_token: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf
        run: |
          choco install protoc -y
          protoc --version

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wmcl-windows-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v3

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin easytier-core --bin easytier-cli

      - name: Package
        shell: pwsh
        run: |
          $pkg = "easytier-windows-${{ matrix.arch_token }}"
          New-Item -ItemType Directory -Force -Path "out/$pkg" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/easytier-core.exe" "out/$pkg/easytier-core.exe"
          Copy-Item "target/${{ matrix.target }}/release/easytier-cli.exe" "out/$pkg/easytier-cli.exe"
          # Windows 的 tun/netfilter 依赖来自 EasyTier 官方仓库的 third_party（windivert-rust 用）
          $third = "easytier/third_party/${{ matrix.arch_token }}"
          Copy-Item "$third/Packet.dll" "out/$pkg/Packet.dll"
          if (Test-Path "$third/WinDivert64.sys") { Copy-Item "$third/WinDivert64.sys" "out/$pkg/WinDivert64.sys" }
          if (Test-Path "$third/wintun.dll") { Copy-Item "$third/wintun.dll" "out/$pkg/wintun.dll" }
          Compress-Archive -Path "out/$pkg" -DestinationPath "out/$pkg-v2.6.4.zip" -Force
          Remove-Item -Recurse -Force "out/$pkg"
          Get-ChildItem "out"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmcl-windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, linux, windows, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wmcl-easytier-v2.6.4
          name: WMCL EasyTier 2.6.4
          body: |
            EasyTier artifacts for the WMCL launcher.
            Desktop: easytier-linux-x86_64-v2.6.4.zip, easytier-linux-aarch64-v2.6.4.zip,
            easytier-macos-x86_64-v2.6.4.zip, easytier-macos-aarch64-v2.6.4.zip,
            easytier-windows-x86_64-v2.6.4.zip, easytier-windows-arm64-v2.6.4.zip
            Android: easytier-android-arm64-v2.6.4.zip, easytier-android-x86_64-v2.6.4.zip
            TCP STUN list extended with China-reachable nodes.
          files: out/*
          overwrite_files: true
